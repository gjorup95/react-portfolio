<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="" />
    <link rel="icon" type="image/svg+xml" href="/codeIcon.svg" />
    <style>
      html {
        background: #f6f9f9;
      }
      .boot-progress {
        position: fixed;
        inset: 0 0 auto;
        height: 0.375rem;
        background: #fee600;
        box-shadow: inset 0 0 0 1px #093f4b;
        transform-origin: left;
        animation: boot-progress 3s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      @keyframes boot-progress {
        from { transform: scaleX(0.05); }
        to { transform: scaleX(0.5); }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-progress { animation: none; transform: scaleX(0.5); }
      }
    </style>
    <title>Full Stack Developer | Troels Gjørup</title>
  </head>
  <body>
    <div id="root">
      <div class="boot-progress" role="progressbar" aria-label="Indlæser side"></div>
    </div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
